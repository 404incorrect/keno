<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Keno 🎯</title>
    <style>
        /* Neon aesthetic styles */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Major+Mono+Display&display=swap');

        :root{
            --bg-1: #07010a;
            --bg-2: #12081a;
            --neon-cyan: #00f5ff;
            --neon-pink: #ff00d4;
            --neon-purple: #8a2be2;
            --neon-green: #00ff9c;
            --muted: rgba(255,255,255,0.06);
        }

        *{box-sizing: border-box;margin:0;padding:0}

        html,body{height:100%}

        /* Put the page background on the html element so it always spans
           the full document height (not just the viewport). Use cover and
           fixed attachment for consistent coverage as content grows. */
        html{
            background: radial-gradient(1200px 600px at 10% 10%, rgba(138,43,226,0.08), transparent 10%),
                        radial-gradient(1000px 500px at 90% 90%, rgba(0,245,255,0.04), transparent 10%),
                        linear-gradient(180deg,var(--bg-1),var(--bg-2));
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }

        body{
            font-family: 'Orbitron', 'Major Mono Display', sans-serif;
            color: #e6fff9;
            -webkit-font-smoothing:antialiased;
            overflow-x:hidden;
            padding:40px 20px;
        }

        /* Floating neon shapes behind the UI */
    .floating-shapes{position:fixed;inset:0;pointer-events:none;z-index:0}
    .shape{position:absolute;font-size:36px;filter:drop-shadow(0 0 12px rgba(0,245,255,0.12)) drop-shadow(0 0 8px rgba(255,0,212,0.08));mix-blend-mode:screen;opacity:0.95;transform:translateY(0);animation:float linear infinite}

    /* Spread shapes across the viewport with varied sizes and delays to avoid bunching */
    .shape:nth-child(1){left:6%; top:10%; font-size:40px; animation-duration:22s; animation-delay: -2s; opacity:0.95}
    .shape:nth-child(2){left:18%; top:60%; font-size:34px; animation-duration:18s; animation-delay: -6s; opacity:0.9}
    .shape:nth-child(3){left:30%; top:30%; font-size:46px; animation-duration:24s; animation-delay: -4s; opacity:0.95}
    .shape:nth-child(4){left:42%; top:75%; font-size:30px; animation-duration:20s; animation-delay: -10s; opacity:0.85}
    .shape:nth-child(5){left:55%; top:18%; font-size:38px; animation-duration:26s; animation-delay: -8s; opacity:0.95}
    .shape:nth-child(6){left:68%; top:50%; font-size:32px; animation-duration:19s; animation-delay: -3s; opacity:0.9}
    .shape:nth-child(7){left:80%; top:28%; font-size:44px; animation-duration:21s; animation-delay: -12s; opacity:0.95}
    .shape:nth-child(8){left:90%; top:68%; font-size:36px; animation-duration:23s; animation-delay: -7s; opacity:0.9}

    @keyframes float{0%{transform:translateY(110vh) rotate(0)}40%{transform:translateY(40vh) rotate(140deg)}70%{transform:translateY(10vh) rotate(250deg)}100%{transform:translateY(-30vh) rotate(360deg)}}

    /* SVG inside shapes uses currentColor so we can tint via color and add glow */
    .shape svg{width:1em;height:1em;display:block;fill:currentColor;stroke:currentColor}
    .shape{transition:transform .6s ease, opacity .6s ease}


    .container{max-width:920px;margin:0 auto;position:relative;z-index:1;padding:20px}

        h1{
            font-size:3.2rem;text-align:center;margin-bottom:22px;
            letter-spacing:2px;color:var(--neon-cyan);
            text-shadow:
                0 0 6px rgba(0,245,255,0.6),
                0 0 18px rgba(0,245,255,0.25),
                0 0 36px rgba(138,43,226,0.12),
                0 6px 0 rgba(0,0,0,0.35);
            transform-origin:center;
            animation:gentle 4s ease-in-out infinite;
        }

        @keyframes gentle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

        .game-info{
            display:flex;gap:12px;justify-content:space-between;margin-bottom:18px;padding:14px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid var(--muted);box-shadow:0 6px 30px rgba(0,0,0,0.6),0 0 24px rgba(138,43,226,0.04);
        }

        .info-item{font-size:1.05rem;font-weight:700;color:rgba(230,255,249,0.95)}

        .keno-board{
            display:grid;grid-template-columns:repeat(10,1fr);gap:8px;padding:14px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12));border:1px solid rgba(255,255,255,0.03);box-shadow:0 10px 40px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.35);
            margin-bottom:14px;position:relative;max-width:100%;
        }

        .number-cell{
            aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.92rem;font-weight:800;cursor:pointer;position:relative;overflow:hidden;color:rgba(230,255,249,0.95);
            background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border:1.6px solid rgba(0,245,255,0.06);transition:transform .14s cubic-bezier(.2,.8,.2,1), box-shadow .14s cubic-bezier(.2,.8,.2,1), background .14s ease;
            box-shadow:0 6px 14px rgba(0,0,0,0.6);
            padding:6px;
            /* touch target minimum to improve tappability on mobile */
            min-width:48px; /* ensures roughly 48x48 touch target */
            min-height:48px;
        }

        .number-cell:hover{transform:translateY(-6px) scale(1.06);box-shadow:0 18px 40px rgba(0,0,0,0.7), 0 0 18px rgba(0,245,255,0.06)}

        /* Neon selected */
        .number-cell.selected{
            /* outline-only selection: transparent fill, colored border and subtle glow (no green palettes used here) */
            background: transparent;
            color: var(--neon-text, var(--neon-pink));
            transform: scale(1.06);
            border-width: 2px;
            border-style: solid;
            border-color: var(--neon-border, rgba(255,0,212,0.35));
            box-shadow: 0 6px 14px rgba(0,0,0,0.6), 0 0 14px var(--neon-glow, rgba(255,0,212,0.12));
            text-shadow: 0 0 6px var(--neon-text-shadow, rgba(255,0,212,0.9));
            animation:pop 420ms cubic-bezier(.175,.885,.32,1.275);
        }

        @keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.18)}100%{transform:scale(1.12)}}

        /* winning numbers show an outlined neon ring first; when .filled added they fill green */
        .number-cell.winning{
            background: transparent;
            color: var(--win-text, #00ff9c);
            border-width: 2.5px;
            border-style: solid;
            border-color: var(--win-border, rgba(0,255,156,0.45));
            box-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 0 18px rgba(0,255,156,0.12);
            animation: glowPulse 1s ease-in-out infinite;
        }

        .number-cell.winning.filled{
            /* filled green state */
            background: linear-gradient(135deg, rgba(0,255,156,0.12), rgba(0,200,120,0.16));
            color: #041017;
            box-shadow: 0 0 28px rgba(0,255,156,0.22), 0 0 44px rgba(0,200,120,0.16), 0 16px 30px rgba(0,0,0,0.6);
            border-color: rgba(0,255,156,0.55);
            transform: scale(1.08);
            animation: none;
        }

        @keyframes glowPulse{0%,100%{transform:scale(1.06);filter:brightness(1)}50%{transform:scale(1.12);filter:brightness(1.08)}}

        .dart{position:absolute;font-size:1.6rem;pointer-events:none;z-index:60}

            /* draw ball used during the slow draw animation */
            .draw-ball{
                position:absolute; /* place inside the board so it scrolls with content */
                /* scale the ball responsively on small screens */
                width:clamp(40px, 8vw, 56px);
                height:clamp(40px, 8vw, 56px);
                border-radius:50%;z-index:120;color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(0.9rem,2.4vw,1.2rem);pointer-events:none;
                background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.2) 10%, transparent 30%), linear-gradient(135deg, rgba(255,160,240,0.12), rgba(0,245,255,0.12));
                box-shadow:0 6px 26px rgba(0,0,0,0.6), 0 0 30px rgba(0,245,255,0.12);
                transition:opacity .25s ease, filter .25s ease, transform .25s ease;
                opacity:0;backdrop-filter:blur(2px);
            }
            .draw-ball .core{width:clamp(26px,5vw,34px);height:clamp(26px,5vw,34px);border-radius:50%;background:linear-gradient(135deg,#fff7, #ffffff22);box-shadow:0 0 18px rgba(255,255,255,0.4) inset,0 0 30px rgba(0,245,255,0.12)}

    .controls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}

    /* speed control styles */
    .speed-control{display:flex;align-items:center;gap:8px;color:rgba(230,255,249,0.9);font-weight:700}
    .speed-control label{font-size:0.85rem;color:var(--neon-cyan)}
    .speed-control input[type="range"]{width:140px}
    .speed-control #speed-value{min-width:44px;text-align:right;font-size:0.9rem;color:var(--neon-pink)}

        button{
            font-family:inherit;font-size:1rem;font-weight:700;padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--neon-cyan);cursor:pointer;transition:all .18s ease;position:relative;box-shadow:0 6px 18px rgba(0,0,0,0.6),0 0 10px rgba(0,245,255,0.04);text-shadow:0 0 8px rgba(0,245,255,0.12)}

        button:hover{transform:translateY(-4px);box-shadow:0 18px 48px rgba(0,0,0,0.7),0 0 28px rgba(0,245,255,0.12);color:var(--neon-pink);text-shadow:0 0 12px rgba(255,0,212,0.22)}

        button:active{transform:translateY(0)}

        .results{padding:18px;border-radius:12px;text-align:center;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.08));border:1px solid rgba(255,255,255,0.02);box-shadow:0 18px 40px rgba(0,0,0,0.65);color:rgba(230,255,249,0.95)}

        .winning-numbers{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}

        .winning-number{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-pink));color:#041017;box-shadow:0 6px 22px rgba(0,245,255,0.12),0 0 24px rgba(255,0,212,0.08);animation:pop .6s ease-out}

        .explosion{position:absolute;pointer-events:none;z-index:100}
        .particle{position:absolute;width:8px;height:8px;border-radius:50%;animation:explode 1s ease-out forwards}

        @keyframes explode{0%{transform:scale(1);opacity:1}100%{transform:scale(.1) translate(var(--dx),var(--dy));opacity:0}}

        /* small responsive tweaks */
            @media (max-width:640px){
                h1{font-size:2rem}
                .keno-board{gap:8px}
            }

            /* Mobile-first responsive board columns and control layout */
            @media (max-width:520px){
                /* reduce visual clutter on small screens */
                .floating-shapes{display:none}

                /* stack controls vertically for thumb reach */
                .controls{flex-direction:column;align-items:stretch}
                .controls > button{width:100%;padding:14px 12px}
                .speed-control{justify-content:space-between;width:100%;padding:6px 4px}

                /* fewer columns on especially narrow devices so cells remain tappable */
                .keno-board{grid-template-columns:repeat(8,1fr)}
            }

            @media (max-width:420px){
                .keno-board{grid-template-columns:repeat(5,1fr)}
                .number-cell{font-size:1rem}
                .speed-control input[type="range"]{width:120px}
            }

            /* Respect reduced motion preferences */
            @media (prefers-reduced-motion: reduce){
                .shape, .draw-ball, .particle, .number-cell{animation-duration: 1ms !important; transition-duration: 1ms !important}
                .shape{animation: none}
            }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape" data-icon="dice" aria-hidden="true">
            <!-- dice -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
                <rect x="6" y="6" width="52" height="52" rx="8" ry="8" fill="none" stroke="currentColor" stroke-width="3" />
                <circle cx="20" cy="20" r="3.2" fill="currentColor" />
                <circle cx="44" cy="20" r="3.2" fill="currentColor" />
                <circle cx="20" cy="44" r="3.2" fill="currentColor" />
                <circle cx="44" cy="44" r="3.2" fill="currentColor" />
            </svg>
        </div>
        <div class="shape" data-icon="target" aria-hidden="true">
            <!-- target -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
                <circle cx="32" cy="32" r="18" fill="none" stroke="currentColor" stroke-width="3" />
                <circle cx="32" cy="32" r="10" fill="none" stroke="currentColor" stroke-width="3" />
                <circle cx="32" cy="32" r="4" fill="currentColor" />
            </svg>
        </div>
        <div class="shape" data-icon="star" aria-hidden="true">
            <!-- star -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
                <polygon points="32,6 39,26 60,26 42,38 48,58 32,46 16,58 22,38 4,26 25,26" fill="currentColor" />
            </svg>
        </div>
        <div class="shape" data-icon="tent" aria-hidden="true">
            <!-- tent -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
                <path d="M6 50 L32 10 L58 50 Z" fill="none" stroke="currentColor" stroke-width="3" />
                <path d="M22 50 L32 30 L42 50" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
        </div>
        <div class="shape" data-icon="palette" aria-hidden="true">
            <!-- palette -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
                <path d="M52 38c0 9-7 16-16 16-9 0-16-7-16-16 0-9 7-25 16-25 9 0 16 16 16 25z" fill="none" stroke="currentColor" stroke-width="3" />
                <circle cx="28" cy="28" r="3" fill="currentColor" />
                <circle cx="36" cy="20" r="3" fill="currentColor" />
                <circle cx="44" cy="30" r="3" fill="currentColor" />
            </svg>
        </div>
        <div class="shape" data-icon="masks" aria-hidden="true">
            <!-- theatre masks -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
                <path d="M20 14c-6 0-10 6-10 12s4 12 10 12 10-6 10-12-4-12-10-12z" fill="none" stroke="currentColor" stroke-width="2" />
                <path d="M44 18c-6 0-10 6-10 12s4 12 10 12 10-6 10-12-4-12-10-12z" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
        </div>
        <div class="shape" data-icon="camp" aria-hidden="true">
            <!-- camp icon (simple cabin) -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
                <path d="M6 46 L32 14 L58 46 Z" fill="none" stroke="currentColor" stroke-width="3" />
                <rect x="20" y="34" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
        </div>
        <div class="shape" data-icon="spark" aria-hidden="true">
            <!-- sparkle -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
                <path d="M32 4 L36 20 L52 24 L36 28 L32 44 L28 28 L12 24 L28 20 Z" fill="currentColor" />
            </svg>
        </div>
    </div>

    <div class="container">
        <h1>🎯 KENO 🎯</h1>
        
        <div class="game-info">
            <div class="info-item">Selected: <span id="selected-count">0</span>/10</div>
            <div class="info-item">Matches: <span id="matches">0</span></div>
            <div class="info-item">Games Played: <span id="games-played">0</span></div>
        </div>

        <div class="keno-board" id="keno-board"></div>

        <div class="controls">
            <button onclick="clearSelection()">🧹 Clear All</button>
            <button onclick="quickPick()">🎲 Quick Pick</button>
            <button onclick="drawNumbers()" id="draw-btn">🎯 DRAW!</button>
            <!-- speed control slider: lower is slower, higher is faster -->
            <div class="speed-control" title="Adjust draw speed">
                <label for="speed-range">Speed</label>
                <input id="speed-range" type="range" min="0.25" max="2" step="0.05" value="1">
                <span id="speed-value">1.00x</span>
            </div>
        </div>

        <div class="results" id="results">
            <p>Select up to 10 numbers, then hit DRAW to see the magic! ✨</p>
            <div class="winning-numbers" id="winning-numbers"></div>
        </div>
    </div>

    <script>
        let selectedNumbers = new Set();
        let winningNumbers = [];
        let gamesPlayed = 0;
        let isDrawing = false;
    // speed multiplier: >1 is faster, <1 is slower
    let speedMultiplier = 1.0;
        // Map from number to palette object applied when selected
        const cellPalettes = new Map();

        // Predefined neon palettes
        // NEON palettes used for selections — exclude the green/win palette so selections never appear green
        const NEON_PALETTES = [
            {start: 'rgba(0,245,255,0.08)', end: 'rgba(0,122,255,0.06)', text: '#00f5ff', glow: 'rgba(0,245,255,0.22)', border: 'rgba(0,122,255,0.35)', textShadow: 'rgba(0,245,255,0.9)'},
            {start: 'rgba(255,0,212,0.08)', end: 'rgba(255,94,0,0.06)', text: '#ff00d4', glow: 'rgba(255,0,212,0.22)', border: 'rgba(255,0,212,0.35)', textShadow: 'rgba(255,0,212,0.9)'},
            {start: 'rgba(138,43,226,0.08)', end: 'rgba(58,12,163,0.06)', text: '#8a2be2', glow: 'rgba(138,43,226,0.22)', border: 'rgba(138,43,226,0.35)', textShadow: 'rgba(138,43,226,0.9)'},
            {start: 'rgba(255,255,0,0.08)', end: 'rgba(255,150,0,0.06)', text: '#fff36b', glow: 'rgba(255,255,0,0.22)', border: 'rgba(255,200,0,0.35)', textShadow: 'rgba(255,255,0,0.9)'}
        ];

        // Palette used to indicate winning/fill state (green)
        const WIN_PALETTE = {start: 'rgba(0,255,156,0.12)', end: 'rgba(0,200,120,0.16)', text: '#041017', glow: 'rgba(0,255,156,0.22)', border: 'rgba(0,255,156,0.55)'};

        // Initialize the board
        function initializeBoard() {
            const board = document.getElementById('keno-board');
            for (let i = 1; i <= 80; i++) {
                const cell = document.createElement('div');
                cell.className = 'number-cell';
                cell.textContent = i;
                cell.onclick = () => selectNumber(i, cell);
                board.appendChild(cell);
            }
        }

        function selectNumber(num, cell) {
            if (isDrawing) return;
            
            if (selectedNumbers.has(num)) {
                selectedNumbers.delete(num);
                cell.classList.remove('selected');
                // remove per-cell palette variables
                cell.style.removeProperty('--neon-start');
                cell.style.removeProperty('--neon-end');
                cell.style.removeProperty('--neon-text');
                cell.style.removeProperty('--neon-glow');
                cell.style.removeProperty('--neon-border');
                cell.style.removeProperty('--neon-text-shadow');
                cellPalettes.delete(num);
            } else if (selectedNumbers.size < 10) {
                selectedNumbers.add(num);
                cell.classList.add('selected');

                // choose a palette different from others if possible
                const used = new Set(Array.from(cellPalettes.values()).map(p => JSON.stringify(p)));
                let palette = NEON_PALETTES[Math.floor(Math.random() * NEON_PALETTES.length)];
                // try multiple times to avoid duplicates
                for (let i = 0; i < 6; i++){
                    const cand = NEON_PALETTES[Math.floor(Math.random() * NEON_PALETTES.length)];
                    if (!used.has(JSON.stringify(cand))){ palette = cand; break; }
                }

                cellPalettes.set(num, palette);

                // apply CSS variables to the cell for neon colors
                cell.style.setProperty('--neon-start', palette.start);
                cell.style.setProperty('--neon-end', palette.end);
                cell.style.setProperty('--neon-text', palette.text);
                cell.style.setProperty('--neon-glow', palette.glow);
                cell.style.setProperty('--neon-border', palette.border);
                cell.style.setProperty('--neon-text-shadow', palette.textShadow);
                
                // Create a small explosion/particle effect (remove the dart/ball animation during selection)
                // The draw-ball should only appear during the draw sequence.
                createExplosion(cell);
            }
            
            updateSelectedCount();
        }

        function createDartAnimation(cell) {
            const dart = document.createElement('div');
            dart.className = 'dart';
            dart.textContent = '🎯';
            dart.style.position = 'absolute';
            dart.style.left = Math.random() * window.innerWidth + 'px';
            dart.style.top = '0px';
            dart.style.zIndex = '1000';
            document.body.appendChild(dart);

            const cellRect = cell.getBoundingClientRect();
            const targetX = cellRect.left + cellRect.width / 2;
            const targetY = cellRect.top + cellRect.height / 2;

            dart.animate([
                { 
                    left: dart.style.left, 
                    top: '0px', 
                    transform: 'rotate(0deg) scale(0.5)',
                    opacity: '0'
                },
                { 
                    left: targetX + 'px', 
                    top: targetY + 'px', 
                    transform: 'rotate(720deg) scale(1.5)',
                    opacity: '1'
                },
                { 
                    left: targetX + 'px', 
                    top: targetY + 'px', 
                    transform: 'rotate(720deg) scale(0)',
                    opacity: '0'
                }
            ], {
                duration: 800,
                easing: 'ease-out'
            }).onfinish = () => dart.remove();
        }

        function createExplosion(cell) {
            const rect = cell.getBoundingClientRect();
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            // Use fixed positioning so coordinates from getBoundingClientRect() map to the viewport reliably
            explosion.style.position = 'fixed';
            // place the explosion at the center of the cell
            explosion.style.left = (rect.left + rect.width / 2) + 'px';
            explosion.style.top = (rect.top + rect.height / 2) + 'px';
            // center the explosion element exactly at the coordinates
            explosion.style.transform = 'translate(-50%, -50%)';
            explosion.style.pointerEvents = 'none';
            explosion.style.zIndex = '1000';
            document.body.appendChild(explosion);

            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7'];
            
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = (i / 12) * Math.PI * 2;
                const distance = 100 + Math.random() * 100;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;
                
                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');
                
                // start each particle at the origin of the explosion element (center of the cell)
                particle.style.left = '0px';
                particle.style.top = '0px';
                particle.style.position = 'absolute';
                explosion.appendChild(particle);
            }

            setTimeout(() => explosion.remove(), 1000);
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = selectedNumbers.size;
        }

        function clearSelection() {
            if (isDrawing) return;
            
            selectedNumbers.clear();
            document.querySelectorAll('.number-cell').forEach(cell => {
                cell.classList.remove('selected', 'winning', 'filled');
                // remove any inline neon variables (selection & win)
                ['--neon-start','--neon-end','--neon-text','--neon-glow','--neon-border','--neon-text-shadow','--win-border','--win-text'].forEach(k=>cell.style.removeProperty(k));
            });
            cellPalettes.clear();
            updateSelectedCount();
        }

        function quickPick() {
            if (isDrawing) return;
            
            clearSelection();
            
            // Use crypto.getRandomValues for truly random quick picks
            const availableNumbers = Array.from({length: 80}, (_, i) => i + 1);
            
            // Shuffle using a cryptographically secure, unbiased shuffle
            cryptoShuffle(availableNumbers);
            
            // Take first 10 numbers
            const numbers = availableNumbers.slice(0, 10);
            
            numbers.forEach((num, index) => {
                setTimeout(() => {
                    const cell = document.querySelector(`.number-cell:nth-child(${num})`);
                    // reuse selectNumber behavior so palettes are applied
                    selectNumber(num, cell);
                    updateSelectedCount();
                }, index * 100);
            });
        }

        function drawNumbers() {
            if (selectedNumbers.size === 0 || isDrawing) return;

            isDrawing = true;
            document.getElementById('draw-btn').textContent = '🎯 Drawing...';

            // Generate truly random winning numbers using crypto.getRandomValues for better randomness
            winningNumbers = [];
            const availableNumbers = Array.from({length: 80}, (_, i) => i + 1);

            // Shuffle array using a cryptographically secure, unbiased shuffle
            cryptoShuffle(availableNumbers);

            // Take first 20 numbers from shuffled array
            winningNumbers = availableNumbers.slice(0, 20);

            // Clear previous winning highlights and any filled state/inline variables
            document.querySelectorAll('.number-cell').forEach(cell => {
                cell.classList.remove('winning', 'filled');
                ['--neon-start','--neon-end','--neon-text','--neon-glow','--neon-border','--neon-text-shadow','--win-border','--win-text'].forEach(k=>cell.style.removeProperty(k));
            });

            // Animate winning numbers using a slower draw ball for suspense
            const winningNumbersDiv = document.getElementById('winning-numbers');
            winningNumbersDiv.innerHTML = '';

            // run the sequence
            (async function runSequence(){
                const board = document.getElementById('keno-board');
                // create the draw ball directly inside the board so sizing and coordinates match
                const drawBall = createDrawBall(board);

                // helper to compute coordinates relative to the board container using the actual drawBall
                const centerOf = (el) => {
                    const boardRect = board.getBoundingClientRect();
                    const r = el.getBoundingClientRect();
                    // position relative to board's top-left; subtract half of the drawBall size to center
                    return {
                        x: Math.round((r.left - boardRect.left) + r.width/2 - drawBall.offsetWidth/2),
                        y: Math.round((r.top - boardRect.top) + r.height/2 - drawBall.offsetHeight/2)
                    };
                };

                // compute board center relative to board
                const boardCenter = centerOf(board);
                // start above the board center (off-screen relative to board)
                drawBall.style.left = boardCenter.x + 'px';
                drawBall.style.top = (boardCenter.y - (board.offsetHeight * 0.55)) + 'px';
                drawBall.style.opacity = '1';
                // fly in to center on first draw (scaled by speedMultiplier)
                await animateBallTo(drawBall, boardCenter.x, boardCenter.y, (450 + Math.random() * 150) / speedMultiplier);

                for (let i = 0; i < winningNumbers.length; i++){
                    const num = winningNumbers[i];
                    // create and append the visible winning list entry (so the list fills slowly too)
                    const winningSpan = document.createElement('div');
                    winningSpan.className = 'winning-number';
                    winningSpan.textContent = num;
                    winningNumbersDiv.appendChild(winningSpan);

                    // short hover for suspense (visual only)
                    await hoverBall(drawBall, (220 + Math.random() * 180) / speedMultiplier);

                    const cell = document.querySelector(`.number-cell:nth-child(${num})`);
                    if (!cell) continue;

                    // compute target coordinates (center of the cell) relative to the board
                    const targetPos = centerOf(cell);
                    const targetX = targetPos.x;
                    const targetY = targetPos.y;

                    // animate ball from its current left/top to the target using left/top animation so it scrolls with content (faster)
                    await animateBallTo(drawBall, targetX, targetY, (380 + Math.random() * 220) / speedMultiplier);

                    // hit effect
                    cell.classList.add('winning');
                    cell.classList.remove('selected');
                    cell.style.setProperty('--win-border', WIN_PALETTE.border);
                    cell.style.setProperty('--win-text', WIN_PALETTE.text);
                    createExplosion(cell);

                    // settle a moment then fill green
                    await sleep(520 / speedMultiplier);
                    cell.classList.add('filled');
                    cell.style.setProperty('--neon-start', WIN_PALETTE.start);
                    cell.style.setProperty('--neon-end', WIN_PALETTE.end);

                    // return ball to the center of the board smoothly
                    const boardCenterAfter = centerOf(board);
                    await animateBallTo(drawBall, boardCenterAfter.x, boardCenterAfter.y, (300 + Math.random() * 120) / speedMultiplier);

                    // small pause before next draw
                    await sleep((260 + Math.random() * 180) / speedMultiplier);
                }
                // remove ball
                drawBall.remove();
                // finish
                showResults();
            })();
        }

        function showResults() {
            const matches = winningNumbers.filter(num => selectedNumbers.has(num)).length;
            gamesPlayed++;
            
            document.getElementById('matches').textContent = matches;
            document.getElementById('games-played').textContent = gamesPlayed;
            
            const resultsMessages = [
                "🎉 COSMIC JACKPOT! 🎉",
                "✨ Magical Match! ✨",
                "🎪 Spectacular! 🎪",
                "🌟 Stellar Performance! 🌟",
                "🎭 Dramatic Success! 🎭"
            ];
            
            const message = matches > 5 ? 
                resultsMessages[Math.floor(Math.random() * resultsMessages.length)] : 
                `You matched ${matches} numbers!`;
            // update the results message but keep the existing winning numbers DOM intact
            const resultsDiv = document.getElementById('results');
            const existingWinning = document.getElementById('winning-numbers');
            resultsDiv.querySelector('p')?.remove();
            const p = document.createElement('p');
            p.textContent = message;
            resultsDiv.insertBefore(p, existingWinning);
            
            isDrawing = false;
            document.getElementById('draw-btn').textContent = '🎯 DRAW!';
        }

        // Initialize the game
        initializeBoard();
        // Randomize floating shapes after board initialization
        randomizeFloatingShapes();

        // wire up speed slider
        const speedRange = document.getElementById('speed-range');
        const speedValue = document.getElementById('speed-value');
        if (speedRange){
            speedRange.addEventListener('input', (e) => {
                speedMultiplier = parseFloat(e.target.value) || 1.0;
                speedValue.textContent = speedMultiplier.toFixed(2) + 'x';
            });
        }

        // Randomize positions, sizes, delays and colors for the floating SVG shapes
        function randomizeFloatingShapes(){
            const shapes = Array.from(document.querySelectorAll('.floating-shapes .shape'));
            const glowColors = ['#00f5ff', '#ff00d4', '#8a2be2', '#00ff9c', '#fff36b'];

            shapes.forEach((el, idx) => {
                // randomize position within safe margins
                const left = Math.round(Math.random() * 88) + 1; // 1% - 89%
                const top = Math.round(Math.random() * 80) + 5; // 5% - 85%
                const size = Math.round((Math.random() * 28) + 28); // 28 - 56px
                const duration = Math.round((Math.random() * 12) + 16); // 16 - 28s
                const delay = Math.round(Math.random() * -20); // negative delays for staggered starts
                const color = glowColors[idx % glowColors.length] || glowColors[Math.floor(Math.random()*glowColors.length)];

                el.style.left = left + '%';
                el.style.top = top + '%';
                el.style.fontSize = size + 'px';
                el.style.animationDuration = duration + 's';
                el.style.animationDelay = delay + 's';
                el.style.color = color;
                el.style.opacity = 0.85 + Math.random() * 0.15;

                // Add a neon glow using drop-shadow filter and text-shadow
                el.style.filter = `drop-shadow(0 0 ${Math.round(size/8)}px ${color}AA)`;
            });
        }

        // --- Cryptographically secure utilities ---
        // Returns a uniformly-distributed integer in [0, maxExclusive) using
        // rejection sampling over 32-bit random values to avoid modulo bias.
        function cryptoRandomInt(maxExclusive){
            if (maxExclusive <= 0) return 0;
            const UINT32_RANGE = 0x100000000; // 2^32
            // largest multiple of maxExclusive less than 2^32
            const bound = Math.floor(UINT32_RANGE / maxExclusive) * maxExclusive;
            const r = new Uint32Array(1);
            while (true){
                crypto.getRandomValues(r);
                const val = r[0];
                if (val < bound) return val % maxExclusive;
            }
        }

        // In-place Fisher-Yates shuffle using cryptoRandomInt for unbiased swaps
        function cryptoShuffle(array){
            for (let i = array.length - 1; i > 0; i--) {
                const j = cryptoRandomInt(i + 1);
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // --- Helper animation utilities for the draw ball sequence ---
        function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

        function animateElement(el, keyframes, duration=600){
            return new Promise(resolve=>{
                const anim = el.animate(keyframes, {duration: duration, easing: 'cubic-bezier(.22,.9,.35,1)'});
                anim.onfinish = () => resolve();
            });
        }

        // Animate the ball by interpolating left/top values so it remains stable while the page scrolls
        function animateBallTo(ball, targetLeft, targetTop, duration=600){
            return new Promise(resolve => {
                const startLeft = parseFloat(ball.style.left) || 0;
                const startTop = parseFloat(ball.style.top) || 0;
                const deltaX = targetLeft - startLeft;
                const deltaY = targetTop - startTop;
                const start = performance.now();

                function frame(now){
                    const t = Math.min(1, (now - start) / duration);
                    // ease in-out cubic
                    const eased = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
                    ball.style.left = (startLeft + deltaX * eased) + 'px';
                    ball.style.top = (startTop + deltaY * eased) + 'px';
                    if (t < 1) requestAnimationFrame(frame);
                    else resolve();
                }

                requestAnimationFrame(frame);
            });
        }

        // parent (optional) is the container to append the ball into (e.g., the board) so it scrolls with content
        function createDrawBall(parent){
            const ball = document.createElement('div');
            ball.className = 'draw-ball';
            ball.innerHTML = `<div class="core"></div>`;
            const container = parent || document.body;
            container.appendChild(ball);
            // initial position will be set by caller; set left/top defaults relative to parent so animateBallTo can read values
            ball.style.left = '0px';
            ball.style.top = '0px';
            ball.style.opacity = '0';
            return ball;
        }

        async function hoverBall(ball, ms){
            // small hovering animation loop while waiting
            ball.style.opacity = '1';
            const start = performance.now();
            while (performance.now() - start < ms){
                await animateElement(ball, [
                    { transform: 'translateY(0px)' },
                    { transform: 'translateY(8px)' }
                ], 600);
                await animateElement(ball, [
                    { transform: 'translateY(8px)' },
                    { transform: 'translateY(0px)' }
                ], 600);
            }
        }
    </script>
